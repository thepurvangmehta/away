name: tests
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Git identity for the test repos
        run: |
          git config --global user.name "away-ci"
          git config --global user.email "away-ci@example.com"
      - name: Run the checks
        run: python test_away.py
